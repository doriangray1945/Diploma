services:
  postgres:
    image: paradedb/paradedb:latest
    container_name: furniture-postgres
    environment:
      POSTGRES_DB: furniture_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PG18+ in the paradedb image expects data in a major-version-named
      # subdir under /var/lib/postgresql. Set PGDATA explicitly so a single
      # mount at /var/lib/postgresql/data still works the way it did under
      # pgvector/pgvector:pg16.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: furniture-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: furniture-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/furniture_store
      SECRET_KEY: your-super-secret-key-change-in-production-123456
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: furniture-3b-v5
      PYTHONPATH: /app
      ADMIN_EMAIL: admin@admin.com
      ADMIN_PASSWORD: admin12345
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: /minio
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: furniture-images
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build: ./frontend
    container_name: furniture-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
